<body>
<div id="root"></div>
<script>
(function () {
  var SUPABASE_URL = "https://ceprohgvuomvwzrloall.supabase.co";
  var SUPABASE_KEY = "sb_publishable_DJ0yYKZekzCZbN5KVOPBtA_qCbfGZUU";
  var REST_BASE = SUPABASE_URL + "/rest/v1/";

  function headers(extra) {
    return Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
    }, extra || {});
  }

  function checkOk(res, actionLabel) {
    if (res.ok) return res;
    return res.text().then(function (bodyText) {
      var detail = bodyText;
      try {
        var parsed = JSON.parse(bodyText);
        detail = parsed.message || parsed.hint || parsed.error_description || parsed.msg || bodyText;
      } catch (e) {}
      throw new Error(actionLabel + " 失敗（HTTP " + res.status + "）：" + detail);
    });
  }

  function localKeyFor(k) { return "wdb_personal_" + k; }

  window.storage = {
    get: function (key, shared) {
      if (!shared) {
        return new Promise(function (resolve, reject) {
          try {
            var raw = localStorage.getItem(localKeyFor(key));
            if (raw === null) { reject(new Error("not found")); return; }
            resolve({ key: key, value: raw, shared: false });
          } catch (e) { reject(e); }
        });
      }
      return fetch(REST_BASE + "kv_store?key=eq." + encodeURIComponent(key) + "&select=value", { headers: headers() })
        .then(function (res) { return checkOk(res, "讀取 " + key); })
        .then(function (res) { return res.json(); })
        .then(function (rows) {
          if (!rows || rows.length === 0) throw new Error("not found");
          return { key: key, value: rows[0].value, shared: true };
        });
    },
    set: function (key, value, shared) {
      if (!shared) {
        return new Promise(function (resolve, reject) {
          try { localStorage.setItem(localKeyFor(key), value); resolve({ key: key, value: value, shared: false }); }
          catch (e) { reject(e); }
        });
      }
      return fetch(REST_BASE + "kv_store", {
        method: "POST",
        headers: headers({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify([{ key: key, value: value }]),
      }).then(function (res) { return checkOk(res, "寫入 " + key); })
        .then(function () { return { key: key, value: value, shared: true }; });
    },
    delete: function (key, shared) {
      if (!shared) {
        return new Promise(function (resolve, reject) {
          try { localStorage.removeItem(localKeyFor(key)); resolve({ key: key, deleted: true, shared: false }); }
          catch (e) { reject(e); }
        });
      }
      return fetch(REST_BASE + "kv_store?key=eq." + encodeURIComponent(key), {
        method: "DELETE",
        headers: headers({ "Prefer": "return=minimal" }),
      }).then(function (res) { return checkOk(res, "刪除 " + key); })
        .then(function () { return { key: key, deleted: true, shared: true }; });
    },
    list: function (prefix, shared) {
      if (!shared) {
        return new Promise(function (resolve, reject) {
          try {
            var keys = []; var p = localKeyFor(prefix || "");
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k.indexOf(p) === 0) keys.push(k.replace(localKeyFor(""), ""));
            }
            resolve({ keys: keys, prefix: prefix, shared: false });
          } catch (e) { reject(e); }
        });
      }
      var likePattern = (prefix || "") + "*";
      return fetch(REST_BASE + "kv_store?key=like." + encodeURIComponent(likePattern) + "&select=key", { headers: headers() })
        .then(function (res) { return checkOk(res, "列出 " + prefix); })
        .then(function (res) { return res.json(); })
        .then(function (rows) { return { keys: (rows || []).map(function (r) { return r.key; }), prefix: prefix, shared: true }; });
    },
  };

  window.db = {
    selectAll: function (table) {
      return fetch(REST_BASE + table + "?select=data", { headers: headers() })
        .then(function (res) { return checkOk(res, "讀取資料表 " + table); })
        .then(function (res) { return res.json(); })
        .then(function (rows) { return (rows || []).map(function (r) { return r.data; }); });
    },
    upsertRows: function (table, rows) {
      if (!rows || rows.length === 0) return Promise.resolve();
      return fetch(REST_BASE + table, {
        method: "POST",
        headers: headers({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify(rows),
      }).then(function (res) { return checkOk(res, "寫入資料表 " + table); });
    },
    deleteRow: function (table, idCol, idVal) {
      return fetch(REST_BASE + table + "?" + idCol + "=eq." + encodeURIComponent(idVal), {
        method: "DELETE",
        headers: headers({ "Prefer": "return=minimal" }),
      }).then(function (res) { return checkOk(res, "刪除資料表 " + table + " 的一筆資料"); });
    },
    deleteAll: function (table) {
      var idCol = table === "cards" ? "card_id" : "id";
      return fetch(REST_BASE + table + "?" + idCol + "=neq.__never__", {
        method: "DELETE",
        headers: headers({ "Prefer": "return=minimal" }),
      }).then(function (res) { return checkOk(res, "清空資料表 " + table); });
    },
  };
})();
</script>
